<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Career Predictor</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800&family=Syne:wght@400;500;600&display=swap" rel="stylesheet">

<style>

:root{
    --bg:#050816;
    --card:rgba(12,16,34,0.8);
    --cyan:#00d9ff;
    --pink:#ff3f87;
    --text:#f1f7ff;
    --muted:#7d92ad;
}

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    font-family:'Syne',sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    overflow-x:hidden;
}

canvas{
    position:fixed;
    inset:0;
    width:100%;
    height:100%;
    z-index:0;
}

.container{
    position:relative;
    z-index:2;
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:40px 20px;
}

.box{
    width:100%;
    max-width:720px;
    background:var(--card);
    border-radius:24px;
    padding:40px;
    border:1px solid rgba(255,255,255,0.08);
    backdrop-filter:blur(18px);
    box-shadow:0 20px 70px rgba(0,0,0,0.6);
}

.heading{
    text-align:center;
    margin-bottom:35px;
}

.heading h1{
    font-family:'Orbitron',sans-serif;
    font-size:clamp(38px,6vw,70px);
    line-height:1;
    margin-bottom:12px;

    background:linear-gradient(90deg,#fff,var(--cyan),var(--pink));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

.heading p{
    color:var(--muted);
    font-size:14px;
}

.form-area{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:18px;
}

.input-box{
    display:flex;
    flex-direction:column;
    gap:8px;
}

.full{
    grid-column:1/-1;
}

label{
    font-size:11px;
    letter-spacing:2px;
    text-transform:uppercase;
    color:var(--muted);
}

select,
input{
    width:100%;
    padding:14px 16px;
    border-radius:14px;
    border:1px solid rgba(255,255,255,0.08);
    background:rgba(255,255,255,0.04);
    color:var(--text);
    font-size:14px;
    outline:none;
    transition:0.3s;
}

select{
    cursor:pointer;
    appearance:none;
}

select option{
    background:#0d1228;
}

input:focus,
select:focus{
    border-color:var(--cyan);
    box-shadow:0 0 18px rgba(0,217,255,0.2);
}

button{
    grid-column:1/-1;
    padding:16px;
    border:none;
    border-radius:14px;
    cursor:pointer;

    font-family:'Orbitron',sans-serif;
    letter-spacing:2px;
    font-size:13px;

    color:white;
    background:linear-gradient(135deg,#00bfff,#005eff);

    transition:0.3s;
}

button:hover{
    transform:translateY(-2px);
    box-shadow:0 12px 30px rgba(0,95,255,0.4);
}

.output{
    margin-top:28px;
    padding:24px;
    border-radius:18px;
    text-align:center;

    background:linear-gradient(
        135deg,
        rgba(0,217,255,0.08),
        rgba(255,63,135,0.08)
    );

    border:1px solid rgba(0,217,255,0.18);
}

.output span{
    display:block;
    margin-bottom:10px;
    letter-spacing:2px;
    color:var(--cyan);
    font-size:12px;
}

.output h2{
    font-family:'Orbitron',sans-serif;
    font-size:30px;

    background:linear-gradient(90deg,#fff,var(--cyan));
    -webkit-background-clip:text;
    -webkit-text-fill-color:transparent;
}

@media(max-width:650px){

    .box{
        padding:26px;
    }

    .form-area{
        grid-template-columns:1fr;
    }

    .full,
    button{
        grid-column:auto;
    }
}

</style>
</head>

<body>

<canvas id="bg"></canvas>

<div class="container">

    <div class="box">

        <div class="heading">
            <h1>raviyam<br>PREDICTOR</h1>
            <p>Find career recommendations based on your profile</p>
        </div>

        <form action="/predict" method="post">

            <div class="form-area">

                <div class="input-box">
                    <label>Education</label>

                    <select name="education">
                        {% for item in education_list %}
                        <option value="{{ item }}">{{ item }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="input-box">
                    <label>Specialization</label>

                    <select name="specialization">
                        {% for item in specialization_list %}
                        <option value="{{ item }}">{{ item }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="input-box">
                    <label>Skills</label>

                    <select name="skills">
                        {% for item in skills_list %}
                        <option value="{{ item }}">{{ item }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="input-box">
                    <label>Certifications</label>

                    <select name="certifications">
                        {% for item in certifications_list %}
                        <option value="{{ item }}">{{ item }}</option>
                        {% endfor %}
                    </select>
                </div>

                <div class="input-box full">
                    <label>CGPA / Percentage</label>

                    <input 
                        type="number"
                        step="0.01"
                        name="cgpa"
                        placeholder="Enter your score"
                        required
                    >
                </div>

                <button type="submit">
                    Predict Career
                </button>

            </div>

            {% if prediction %}
            <div class="output">
                <span>PREDICTED CAREER</span>
                <h2>{{ prediction }}</h2>
            </div>
            {% endif %}

        </form>

    </div>

</div>

<script>

const canvas = document.getElementById("bg");
const ctx = canvas.getContext("2d");

let width;
let height;

const dots = [];

function setCanvas(){
    width = canvas.width = window.innerWidth;
    height = canvas.height = window.innerHeight;
}

setCanvas();

window.addEventListener("resize",setCanvas);

class Dot{

    constructor(){

        this.x = Math.random() * width;
        this.y = Math.random() * height;

        this.speedX = (Math.random() - 0.5) * 0.7;
        this.speedY = (Math.random() - 0.5) * 0.7;

        this.radius = Math.random() * 2 + 1;
    }

    move(){

        this.x += this.speedX;
        this.y += this.speedY;

        if(this.x < 0 || this.x > width){
            this.speedX *= -1;
        }

        if(this.y < 0 || this.y > height){
            this.speedY *= -1;
        }
    }

    draw(){

        ctx.beginPath();

        ctx.arc(
            this.x,
            this.y,
            this.radius,
            0,
            Math.PI * 2
        );

        ctx.fillStyle = "rgba(0,217,255,0.8)";
        ctx.fill();
    }
}

for(let i = 0; i < 85; i++){
    dots.push(new Dot());
}

const mouse = {
    x:null,
    y:null
};

window.addEventListener("mousemove",(e)=>{

    mouse.x = e.clientX;
    mouse.y = e.clientY;

});

function drawLines(){

    for(let i = 0; i < dots.length; i++){

        for(let j = i + 1; j < dots.length; j++){

            let dx = dots[i].x - dots[j].x;
            let dy = dots[i].y - dots[j].y;

            let distance = dx * dx + dy * dy;

            if(distance < 10000){

                ctx.strokeStyle = "rgba(0,217,255,0.08)";
                ctx.lineWidth = 1;

                ctx.beginPath();

                ctx.moveTo(dots[i].x,dots[i].y);
                ctx.lineTo(dots[j].x,dots[j].y);

                ctx.stroke();
            }
        }

        let mx = dots[i].x - mouse.x;
        let my = dots[i].y - mouse.y;

        let mouseDistance = mx * mx + my * my;

        if(mouseDistance < 15000){

            ctx.strokeStyle = "rgba(255,63,135,0.2)";

            ctx.beginPath();

            ctx.moveTo(dots[i].x,dots[i].y);
            ctx.lineTo(mouse.x,mouse.y);

            ctx.stroke();
        }
    }
}

function animate(){

    ctx.clearRect(0,0,width,height);

    const gradient = ctx.createLinearGradient(
        0,
        0,
        width,
        height
    );

    gradient.addColorStop(0,"#050816");
    gradient.addColorStop(1,"#02030a");

    ctx.fillStyle = gradient;
    ctx.fillRect(0,0,width,height);

    dots.forEach(dot => {

        dot.move();
        dot.draw();

    });

    drawLines();

    requestAnimationFrame(animate);
}

animate();

</script>

</body>
</html>
